{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-800 text-center">Réinitialiser le mot de passe</h1>
            <p class="text-gray-500 mt-2 text-center">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
            <form method="post" class="space-y-5 mt-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Envoyer
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="{% url 'connexion' %}" class="text-blue-600 font-semibold hover:text-blue-800">Retour à la connexion</a>
            </div>
        </div>
    </div>
</body>
</html>
