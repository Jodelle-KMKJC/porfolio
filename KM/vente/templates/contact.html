{% extends 'home.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-blue-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="flex flex-col md:flex-row">
                <!-- Left Column - Image -->
                <div class="md:w-1/2 bg-blue-100 flex items-center justify-center p-8">
                    <img src="{% static 'vente/con.jpeg' %}" alt="Contact" 
                         class="rounded-lg shadow-md object-cover w-full h-full max-h-[500px]">
                </div>
                
                <!-- Right Column - Contact Form -->
                <div class="md:w-1/2 p-8 sm:p-10">
                    <h2 class="text-3xl font-bold text-blue-800 mb-2">Contact Me</h2>
                    <p class="text-blue-600 mb-6">Have a project in mind? Send me a message!</p>
                    
                    <form class="space-y-5">
                        <div>
                            <label for="name" class="block text-sm font-medium text-blue-700 mb-1">Full Name</label>
                            <input type="text" id="name" name="name" required
                                class="w-full px-4 py-3 rounded-lg border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="Your name">
                        </div>
                        
                        <div>
                            <label for="email" class="block text-sm font-medium text-blue-700 mb-1">Email</label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-3 rounded-lg border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="your@email.com">
                        </div>
                        
                        <div>
                            <label for="subject" class="block text-sm font-medium text-blue-700 mb-1">Subject</label>
                            <input type="text" id="subject" name="subject" required
                                class="w-full px-4 py-3 rounded-lg border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="Subject">
                        </div>
                        
                        <div>
                            <label for="message" class="block text-sm font-medium text-blue-700 mb-1">Message</label>
                            <textarea id="message" name="message" rows="4" required
                                class="w-full px-4 py-3 rounded-lg border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="Your message..."></textarea>
                        </div>
                        
                        <div class="pt-2">
                            <button type="submit"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                                Send Message
                            </button>
                        </div>
                    </form>
                    
                    <div class="mt-6 text-center text-sm text-blue-600">
                        <p>Or reach me directly at: <span class="font-medium">email@example.com</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
