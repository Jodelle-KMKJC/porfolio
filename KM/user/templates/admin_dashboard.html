{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-800 text-center">Tableau de bord Admin</h1>
            <p class="text-gray-500 mt-2 text-center">Bienvenue, {{ user.username }} !</p>
            
            <!-- Formulaire de création de gâteau -->
            <div class="mt-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Créer un nouveau gâteau</h2>
                <form method="POST" action="{% url 'admin_dashboard' %}" enctype="multipart/form-data" class="space-y-4">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                        Créer le gâteau
                    </button>
                </form>
            </div>
            
            <div class="mt-6 text-center">
                <a href="{% url 'start' %}" class="text-blue-600 font-semibold hover:text-blue-800">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</body>
</html>
